# =============================================================================
# PREREGISTERED ANALYSIS PLAN — FROZEN 2026-08-15 (tag v0.2.0-preregistered)
#
# This file is the machine-readable record of the empirical design frozen
# BEFORE any model was estimated or any backtest was run. It is never edited
# after the freeze; deviations are documented in docs/research_design.md.
# tests/test_analysis_plan.py asserts the runtime config matches this plan.
# Prose rationale for every choice: docs/research_design.md.
# =============================================================================

meta:
  frozen_date: "2026-08-15"
  tag: v0.2.0-preregistered
  results_existing_at_freeze: false

hypothesis:
  h0: "net Sharpe(regime-aware min-var) - net Sharpe(rolling Ledoit-Wolf min-var) <= 0"
  primary_strategy: regime_minvar
  primary_comparator: rolling_lw_minvar          # closest non-regime strategy
  primary_outcome: annualized_oos_sharpe_difference_net
  primary_cost_bps: 10
  interval: stationary_bootstrap_95
  secondary_outcomes:
    - annualized_return
    - annualized_volatility
    - max_drawdown
    - sortino
    - calmar
    - turnover_one_way
    - total_cost_drag
    - certainty_equivalent_crra5

sample:
  data_snapshot: data/snapshots/manifest_2026-08-06.json
  full_start: "2004-11-18"
  full_end: "2026-08-06"
  training_end: "2009-12-31"
  oos_start: "2010-01-01"
  estimation_scheme: expanding
  rebalance_frequency: monthly          # signal on last trading day of month

timeline:
  signal_close: t                        # info through close of month-end t
  execution_close: t_plus_1              # trade at next trading day's close
  first_new_weight_return: t1_to_t2      # new weights earn from t+1 -> t+2
  costs_charged_on: execution_date
  macro_signal_lag_days: 1               # all FRED series lagged one extra day
  price_feature_lag_days: 0              # price-derived features usable at t

volatility:
  models: [rolling_hist_63d, ewma_lambda_094, garch_1_1_normal]
  portfolio_model: ewma_lambda_094       # fixed ex ante; loss comparison cannot promote another
  ewma_lambda: 0.94
  hist_window_days: 63
  garch: { p: 1, q: 1, dist: normal }
  min_observations: 252
  horizon: holding_period_integrated_variance
  primary_loss: qlike
  secondary_losses: [mae, rmse]
  pairwise_tests: diebold_mariano_hac
  variance_floor_daily: 1.0e-8
  garch_failure_policy: substitute_ewma_and_log

hmm:
  n_states_main: 2
  n_states_robustness: 3
  features_main: [mkt_log_return, realized_vol_21d, log_vix_lag1, yield_slope_lag1]
  standardization: expanding_zscore_through_t
  probabilities_for_trading: filtered_at_t_only
  smoothed_probabilities: expost_descriptive_only
  n_initializations: 16
  init_seeds_start: 42                   # seeds 42..57 inclusive
  init_selection: max_training_loglikelihood
  label_rule: ascending_state_mean_realized_vol   # state 0 = lower vol
  min_state_occupancy: 0.05
  degenerate_fit_fallback: unconditional_ledoit_wolf_logged

regime_covariance:
  horizon_days: 21
  state_probabilities: horizon_averaged_transition_powers
  state_cov_estimator: responsibility_weighted_shrunk_to_ledoit_wolf
  neff_threshold: 60
  neff_shrinkage_rule: "mix weight n_eff/(n_eff+60) toward unconditional"
  psd_eigenvalue_floor: 1.0e-10

portfolio:
  strategies_main:                       # ablation ladder, in order
    - equal_weight
    - static_6040_monthly
    - static_minvar_training_window
    - rolling_lw_minvar
    - vol_scaled_minvar_ewma
    - regime_minvar
  robustness_benchmarks: [inverse_volatility, static_6040_buy_and_hold]
  long_only: true
  fully_invested: true
  max_weight: 0.40
  expected_return_forecasts: none
  optimizer: scipy_slsqp
  optimizer_failure_policy: hold_drifted_previous_weights_and_log
  volatility_targeting: excluded_from_main   # cash-sleeve variant = optional extension

costs:
  convention: "cost = c * sum_i |w_target_i - w_pretrade_drifted_i|; reported turnover = half that sum"
  main_bps: 10
  sensitivity_bps: [0, 5, 20]
  store_gross_costs_net_separately: true

inference:
  bootstrap: stationary_politis_romano
  bootstrap_replications: 10000
  bootstrap_seed: 12345
  block_length: automatic_rule
  mean_return_se: newey_west_hac
  multiple_testing: "single preregistered primary; SPA named if grid jointly tested"

robustness_grid:
  hmm_states: [2, 3]
  feature_ablations: [drop_vix, drop_realized_vol]
  covariance_estimators: [sample, ewma, ledoit_wolf]
  estimation_windows: [expanding, rolling_5y]
  weight_caps: [0.30, 0.40, 0.50]
  cost_bps: [0, 5, 20]
  universes: [[SPY, IEF, GLD], [SPY, QQQ, IWM, IEF, GLD]]
  hmm_seed_block_alt: 100                # alternative seeds 100..115
  subperiods:
    pre_2020: ["2010-01-01", "2019-12-31"]
    covid: ["2020-02-01", "2020-12-31"]
    tightening_2022: ["2022-01-01", "2023-10-31"]
    post_2020: ["2020-01-01", "2026-08-06"]
  subperiod_status: descriptive_only

seeds:
  global: 42
  hmm_inits: "42..57"
  bootstrap: 12345
